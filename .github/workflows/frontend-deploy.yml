# Frontend CD: after CI passes on main, publish the built files to S3 and invalidate CloudFront.
name: Frontend Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-*.yml"
  workflow_dispatch:

# Default for every job; the deploy job below adds id-token on top of this.
permissions:
  contents: read

# Never run two deploys at once, and never cancel one halfway through an upload.
concurrency:
  group: frontend-deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/frontend-ci.yml

  deploy:
    needs: ci # only runs if lint, tests and build all passed
    runs-on: ubuntu-latest
    permissions:
      id-token: write # request the OIDC token used to assume the AWS role
      contents: read
    env:
      BUCKET: ${{ vars.S3_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      SITE_URL: ${{ vars.SITE_URL }}

    steps:
      - name: Download the build that CI produced
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload hashed assets (cache for a year)
        run: >
          aws s3 sync dist/assets "s3://$BUCKET/assets"
          --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html and other root files (always revalidate)
        run: >
          aws s3 sync dist "s3://$BUCKET"
          --exclude "assets/*" --delete
          --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"

      - name: Smoke test
        run: |
          sleep 15
          curl --fail --silent --show-error --location --output /dev/null "$SITE_URL"
          echo "Deployed and reachable: $SITE_URL"
