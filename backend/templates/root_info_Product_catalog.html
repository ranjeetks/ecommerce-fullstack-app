<!DOCTYPE html>
<html>
<head>
    <title>API Entry Point</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background-color: #f8f9fa;
        }
        h1 {
            color: #dc3545;
        }
        ul {
            list-style: none;
            padding-left: 0;
        }
        li {
            margin: 10px 0;
        }
        a {
            text-decoration: none;
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>
<body>
    <h1>🚀 API Entry Point</h1>
    <p>Welcome! Here are the available endpoints:</p>
    <ul>
        {% for ep in endpoints %}
        <li><a href="{{ ep.url }}">{{ ep.name }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
